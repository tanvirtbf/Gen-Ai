<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>CHAT TPT</title>
  </head>
  <body class="bg-neutral-900 text-white overflow-x-hidden">
    <div class="container mx-auto max-w-3xl pb-44">
      <!-- Messages  -->

      <!-- user messages  -->
      <div class="my-6 bg-neutral-800 p-3 rounded-xl ml-auto max-w-fit">
        Hi, how are you ?
      </div>

      <!-- Assistant message -->
      <div class="max-w-fit">I am fine, how are you ?</div>

      <!-- Bottom Textarea  -->
      <div
        class="fixed inset-x-0 bottom-0 flex items-center justify-center bg-neutral-900"
      >
        <div class="bg-neutral-800 p-2 rounded-3xl w-full max-w-3xl mb-3">
          <textarea
            id="input"
            class="w-full resize-none outline-0 p-3"
            name=""
            id=""
            rows="2"
          ></textarea>
          <div class="flex items-center justify-end">
            <button
              class="bg-white px-4 py-1 rounded-full text-black cursor-pointer hover:bg-gray-300"
            >
              Ask
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
